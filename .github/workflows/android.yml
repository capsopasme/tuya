name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '要补发 APK 的版本 tag（如 v2.0.0）；留空则只构建不发布'
        required: false
        default: ''

permissions:
  contents: write # 打 tag 时要创建 Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # 发布用的 tag：推送 tag 时就是这个 tag；手动运行时取输入的 tag
      REL_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 先跑一遍游戏逻辑模拟（纯 Java，不依赖安卓），关卡生成或物理改坏了会在这里挂掉
      - name: Game logic simulation
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/sim" android/app/src/main/java/io/github/capsopasme/tuya/game/*.java
          java -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -cp "$RUNNER_TEMP/sim" io.github.capsopasme.tuya.game.Sim

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "$REL_TAG" == v* ]]; then
            echo "name=${REL_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 可选：仓库 Secrets 里配了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 就用你自己的密钥签名，
      # 没配就用 android/fallback.keystore
      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # versionCode 从 100 起跳：一定比旧版（WebView 版，最多几十次构建）大，能直接覆盖安装
        run: ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=$((100 + ${{ github.run_number }}))

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "tuya-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tuya-apk
          path: tuya-*.apk

      # 在 GitHub 网页上“新建 Release”时会同时创建 tag：Release 已经存在，就把 APK 传上去（覆盖同名文件）；
      # 用 git push 推 tag 时还没有 Release，就新建一个
      - name: Publish release
        if: startsWith(env.REL_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: tuya-${{ steps.ver.outputs.name }}.apk
        run: |
          NOTES="$(cat .github/release-notes.md 2>/dev/null || echo '安卓 APK，直接安装即可（竖屏、离线、无需任何权限）。')"
          if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$REL_TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$REL_TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "涂鸦蹦蹦 $REL_TAG" --notes "$NOTES"
          fi
