name: Emulator check

# 在安卓模拟器上装好 APK，自动跑一遍各个场景并截图（含旧版 -> 新版的成绩迁移），
# 截图、帧统计和日志推到 ci-shots 分支，方便没有真机时检查画面
on:
  push:
    branches: [native]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-check
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Game logic simulation
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/sim" android/app/src/main/java/io/github/capsopasme/tuya/game/*.java 2>&1 | tee out/sim.log
          java -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -cp "$RUNNER_TEMP/sim" io.github.capsopasme.tuya.game.Sim 2>&1 | tee -a out/sim.log

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName=0.0.0-check -PversionCode=$((100 + ${{ github.run_number }})) 2>&1 | tee ../out/build.log
          cp app/build/outputs/apk/release/app-release.apk ../app.apk
          ls -la ../app.apk | tee -a ../out/build.log

      - name: Old version APK (for migration test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.1.0 --repo "$GITHUB_REPOSITORY" -p '*.apk' -O old.apk || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/shots.sh

      - name: Push results to ci-shots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > out/commit.txt
          cd out
          git init -q
          git checkout -q -b ci-shots
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "shots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-shots
