name: Deploy web version (GitHub Pages)

# 可选：把游戏作为网页部署，手机浏览器打开后可“添加到主屏幕”。
# 使用前要在仓库 Settings → Pages 里把 Source 设为 “GitHub Actions”，然后手动运行本工作流。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
