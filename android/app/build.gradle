plugins {
    id 'com.android.application'
}

def appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('versionName') ?: '2.0.0').toString()

android {
    namespace 'io.github.capsopasme.tuya'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.capsopasme.tuya'
        // 3D 主角用的 AGSL 着色器需要 Android 13（API 33）；12 上自动退回 2D 主角
        minSdk 31
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    // 签名：CI 里配置了 KEYSTORE_FILE 等环境变量就用你自己的密钥；
    // 否则用仓库里的 fallback.keystore（公开的、非机密，只为保证每次构建签名一致，能覆盖安装升级）
    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_FILE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            } else {
                storeFile rootProject.file('fallback.keystore')
                storePassword 'android'
                keyAlias 'tuya'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources.excludes += ['META-INF/**', 'kotlin/**', '*.properties']
    }
}
